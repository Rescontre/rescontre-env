[project]
name = "rescontre-env"
version = "0.1.0"
description = "Verifiable-reward, long-horizon-agency RL environments grounded in clearing semantics."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rescontre" }]
keywords = ["reinforcement-learning", "agents", "environments", "clearing", "settlement", "verifiable-reward"]

# Hard dependency is numpy only. Everything that costs more (a Gym registry,
# an LLM client) is optional so the package clones-installs-runs in minutes
# and the baseline eval runs fully offline.
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
gym = ["gymnasium>=0.29"]
llm = ["openai>=1.0"]      # OpenAI-compatible client: works for local Qwen (Ollama / vLLM / LM Studio) and hosted APIs
plot = ["matplotlib>=3.7"]
dev = ["pytest>=8.0"]

[project.scripts]
rescontre-eval = "rescontre_env.eval:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rescontre_env"]
